<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>룩코퍼레이션 | 준비 중</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root { --red:#E5473E; --ink:#1C1B1A; --gray:#6E6A65; --paper:#F5F2EE; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px;
         background:var(--paper); color:var(--ink); font-family:Pretendard,-apple-system,sans-serif; text-align:center; }
  img { width:72px; height:auto; margin-bottom:32px; }
  h1 { font-size:clamp(28px,6vw,44px); font-weight:700; line-height:1.25; letter-spacing:-.02em; }
  h1 span { color:var(--red); }
  p { margin-top:20px; font-size:17px; line-height:1.6; color:var(--gray); }
  a { color:var(--ink); }
</style>
</head>
<body>
<main>
  <img src="assets/logo.png" alt="Look">
  <h1>작품과 작품 사이,<br><span>무대는 계속됩니다</span></h1>
  <p>룩코퍼레이션 홈페이지를 새로 준비하고 있습니다.<br>문의 <a href="mailto:biz@look-corp.com">biz@look-corp.com</a></p>
</main>
</body>
</html>
